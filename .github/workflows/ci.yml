name: CI Pipeline

on:
  push:
    branches: [ main, master, custom-ui ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Verify Backend
        run: |
          pip install -r backend/requirements.txt
          python -m py_compile backend/src/server.py backend/src/modules/astrology/api/routes_ai.py backend/src/modules/astrology/exporter/export_pdf.py
          python -c "import sys; sys.path.insert(0, 'backend/src'); from modules.astrology.engine import calculate_tuvi_chart; print('Astrology Engine OK')"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies & Build Frontend
        run: |
          cd frontend
          npm ci || npm install --no-audit --no-fund
          npm run build
