# Cấu hình Rate Limit & Production Reverse Proxy cho Tử Vi Hồng Ân
# Đặt các limit_req_zone ở block http{} hoặc /etc/nginx/conf.d/rate_limit.conf
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/m;

# Chuyển hướng toàn bộ HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tuvihongan.com www.tuvihongan.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tuvihongan.com www.tuvihongan.com;

    # Chứng chỉ TLS (Let's Encrypt / Cloudflare Origin)
    ssl_certificate     /etc/letsencrypt/live/tuvihongan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuvihongan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Ẩn phiên bản Nginx & giới hạn payload tối đa
    server_tokens off;
    client_max_body_size 20M;

    # HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://img.vietqr.io; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src 'self' https://accounts.google.com;" always;

    # Nén dữ liệu tĩnh
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Chặn truy cập trực tiếp tệp nhạy cảm / ẩn
    location ~ /\.(?!well-known) {
        deny all;
        return 403;
    }

    # 1. Frontend tĩnh đã build (releases/dist/)
    location / {
        root /var/www/tuvihongan/releases/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Asset cache dài hạn cho tài nguyên có hash
    location /assets/ {
        root /var/www/tuvihongan/releases/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 2. Nhóm API nhạy cảm với Rate Limit nghiêm ngặt
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Streaming SSE cho AI không được buffer
    location = /api/ai/stream-interpret-chart {
        limit_req zone=ai_limit burst=4 nodelay;
        proxy_pass http://127.0.0.1:8080/api/ai/stream-interpret-chart;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 180s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ai/ {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080/api/ai/;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/billing/webhook {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/api/billing/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Các endpoint API còn lại
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
